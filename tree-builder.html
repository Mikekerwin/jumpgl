<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JumpGL Paired Tree Builder</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #102f2b; }
      canvas { display: block; }
      #hud {
        position: fixed; top: 14px; left: 14px; z-index: 10; width: min(390px, calc(100vw - 28px));
        padding: 13px 15px; border: 1px solid rgba(255,255,255,.38); border-radius: 11px;
        color: #effff7; background: rgba(7, 27, 24, .80); backdrop-filter: blur(9px);
        font: 13px/1.42 system-ui, sans-serif; box-shadow: 0 10px 32px rgba(0,0,0,.24);
      }
      #hud strong { display: block; margin-bottom: 3px; font-size: 16px; }
      #hud-title { cursor: grab; user-select: none; touch-action: none; }
      #hud-title:active { cursor: grabbing; }
      #status { color: #b9dfcd; margin-bottom: 8px; }
      #jump-metrics { color: #d7f8e8; margin: 7px 0 2px; font-size: 12px; }
      #hud label { display: grid; grid-template-columns: 94px 1fr 50px; gap: 8px; align-items: center; margin-top: 7px; }
      #hud output { text-align: right; font-variant-numeric: tabular-nums; color: #d8ffec; }
      #hud select, #hud input[type="number"] {
        min-width: 0; width: 100%; padding: 5px 6px; border-radius: 6px; color: #effff7;
        background: #244f42; border: 1px solid rgba(255,255,255,.28); font: inherit;
      }
      #hud .toggle { display: flex; grid-template-columns: none; gap: 8px; }
      #hud .buttons { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 7px; }
      #hud button {
        border: 1px solid rgba(255,255,255,.35); border-radius: 7px; padding: 7px 10px;
        color: #effff7; background: rgba(45, 104, 80, .86); cursor: pointer; font: inherit;
      }
      #hud button:hover { background: rgba(61, 133, 102, .98); }
      #notes { margin-top: 8px; color: #d5eee1; }
      #loading {
        position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
        color: white; background: #102c2c; font: 600 18px system-ui, sans-serif;
      }
    </style>
    <script type="module" crossorigin src="/jumpgl/assets/treeBuilder-aAIQ_zYI.js"></script>
    <link rel="modulepreload" crossorigin href="/jumpgl/assets/index-DR2yh6M6.js">
    <link rel="modulepreload" crossorigin href="/jumpgl/assets/playerPhysics-KMH7HyQP.js">
    <link rel="modulepreload" crossorigin href="/jumpgl/assets/Graphics-Dsq1kP1t.js">
  </head>
  <body>
    <div id="app"></div>
    <div id="hud">
      <strong id="hud-title">Paired Tree Builder · drag</strong>
      <div id="status">Loading coordinated tree pair…</div>
      <label>Seed <input id="seed" type="number" value="1847" min="1" max="9999999" /><output></output></label>
      <label>Base <select id="base-select"></select><output></output></label>
      <label>Canopy <select id="canopy-select"></select><output></output></label>
      <label>Trunk levels <input id="middle-count" type="range" min="6" max="24" step="1" value="12" /><output id="middle-count-output">12</output></label>
      <label>Tree scale <input id="tree-scale" type="range" min="0.45" max="0.78" step="0.01" value="0.64" /><output id="tree-scale-output">0.64</output></label>
      <label>Climb height <input id="climb" type="range" min="0" max="100" step="1" value="0" /><output id="climb-output">0%</output></label>
      <label class="toggle"><input id="show-seams" type="checkbox" /> Show locked connector belts</label>
      <label class="toggle"><input id="show-route" type="checkbox" /> Show vertical + cross-tree routes</label>
      <label class="toggle"><input id="auto-climb" type="checkbox" /> Auto-climb preview</label>
      <div class="buttons">
        <button id="regenerate" type="button">Regenerate (R)</button>
        <button id="random-seed" type="button">Random seed</button>
        <button id="to-base" type="button">Base (G)</button>
        <button id="to-canopy" type="button">Canopy (T)</button>
        <button id="background-builder" type="button">Background trees</button>
      </div>
      <div id="jump-metrics">Measuring JumpGL jump reach…</div>
      <div id="notes">W/↑ climb · S/↓ descend · mouse wheel moves camera · R rebuilds · F fullscreen</div>
    </div>
    <div id="loading">Coordinating the paired trees…</div>
  </body>
</html>
